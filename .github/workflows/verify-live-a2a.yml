name: AI Beacon - verify live A2A deployment

on:
  push:
    branches: [main]
    paths:
      - 'data/a2a-gateway-candidate.json'
  workflow_dispatch:
    inputs:
      gateway_url:
        description: 'Exact Cloudflare Worker origin (https://ai-beacon-a2a.ACCOUNT.workers.dev)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ai-beacon-verified-endpoint
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve proposed Worker URL from workflow input or reviewed repository file
        env:
          INPUT_URL: ${{ inputs.gateway_url }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            URL="$INPUT_URL"
          else
            URL=$(node -e 'const fs=require("fs");const v=JSON.parse(fs.readFileSync("data/a2a-gateway-candidate.json","utf8")).origin;if(typeof v!=="string"||!/^https:\/\/ai-beacon-a2a\.[a-z0-9-]+\.workers\.dev$/i.test(v))process.exit(1);process.stdout.write(v)')
          fi
          echo "A2A_GATEWAY_URL=$URL" >> "$GITHUB_ENV"
      - name: Test actual A2A card and TWO real model turns, then publish URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node gateway/scripts/verify-live.mjs
