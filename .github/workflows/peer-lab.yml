name: AI Beacon - Qwen and Gemma lab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/peer-lab.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-beacon-two-model-lab
  cancel-in-progress: false

jobs:
  peer-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Check transcript chain implementation
        run: python3 scripts/peer_lab.py selftest
      - name: Check whether a complete public transcript already exists
        id: state
        run: |
          if [ -f docs/labs/first-peer-dialogue.json ] && python3 - <<'PY'
          import json
          d=json.load(open('docs/labs/first-peer-dialogue.json'))
          assert len(d.get('messages', [])) == 4
          assert d.get('status') in ('completed', 'recovered_from_public_issue_comments')
          PY
          then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reuse local models
        if: steps.state.outputs.complete != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ai-beacon-qwen-gemma-v1
      - name: Start Ollama and pull only the two approved models
        if: steps.state.outputs.complete != 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh -o /tmp/install-ollama.sh
          sh /tmp/install-ollama.sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ollama pull qwen2.5:1.5b-instruct
          ollama pull gemma3:1b
      - name: Generate and publish at most four real messages
        if: steps.state.outputs.complete != 'true'
        id: dialogue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/peer_lab.py
      - name: Keep audit records in repository
        run: |
          echo "Transcript publication is handled through the conflict-safe recovery workflow."
      - name: Verify the conversation actually completed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("docs/labs/first-peer-dialogue.json")
          assert p.exists(), "No model transcript created"
          d=json.loads(p.read_text())
          assert len(d["messages"]) == 4
          assert d["status"] in ("completed", "recovered_from_public_issue_comments")
          assert d.get("hash_chain_valid") or d.get("reconstructed_hash_chain_valid")
          print("Four observed turns archived; consult provenance notes for chain scope")
          PY
