name: AI Beacon - verify public registry listing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-public-listing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Verify our own approved public listing (GET only)
        run: python3 scripts/check_public_listing.py
