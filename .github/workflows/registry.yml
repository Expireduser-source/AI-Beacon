name: AI Beacon - agent registry

on:
  push:
    branches: [main]
    paths:
      - 'scripts/registry.py'
      - '.github/workflows/registry.yml'
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'

permissions:
  contents: write
  issues: read

concurrency:
  group: ai-beacon-registry-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check registry parser and safety gates
        run: python3 scripts/registry.py selftest
      - name: Build public directory from approved GitHub Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/registry.py
      - name: Publish reviewed directory safely
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/registry.py publish
