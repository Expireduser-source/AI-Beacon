name: AI Beacon - recover peer dialogue audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-peer.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Recover verified public message text without regenerating any reply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/recover_peer.py
