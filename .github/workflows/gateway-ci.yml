name: AI Beacon - A2A gateway tests

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check gateway source syntax
        run: node --check gateway/src/index.mjs
      - name: Check live verification script syntax
        run: node --check gateway/scripts/verify-live.mjs
      - name: Validate gateway configuration
        run: node -e "const c=JSON.parse(require('fs').readFileSync('gateway/wrangler.jsonc','utf8'));if(!c.ai||!c.durable_objects||c.name!=='ai-beacon-a2a')process.exit(1)"
      - name: Test all A2A routes without secrets or external requests
        working-directory: gateway
        run: npm test
