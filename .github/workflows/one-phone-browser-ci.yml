name: AI Beacon - One-Phone Bridge Browser Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-phone-browser-ci.yml'
      - 'docs/bridge/**'
  pull_request:
    paths:
      - 'docs/bridge/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-page:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser test
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Serve Pages source and check visible external transcript
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory docs > /tmp/ai-beacon-bridge-http.log 2>&1 &
          sleep 2
          node docs/bridge/tests/browser-viewer.e2e.mjs
