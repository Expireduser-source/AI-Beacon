name: AI Beacon - read-only external peer discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-peers.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

concurrency:
  group: ai-beacon-peer-candidates
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Search two public A2A registry categories (read only, no peer contact)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/discover_peer_candidates.py
